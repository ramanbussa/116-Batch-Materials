# ============================================================
# 1. NAMESPACE
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-demo


namespace-creation.yml

kubectl apply -f namespace-creation.yml


Manually 

kubectl get ns
kubectl create ns nginx-demo

kubectl create ns dev
kubectl create ns qa
kubectl create ns prod


kubectl create ns app-ns
kubectl create ns backendname-ns
kubectl create ns monitoring
---
# ============================================================
# 2. CONFIGMAP
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: nginx-demo
data:
  APP_NAME: "Nginx Kubernetes Demo"
  ENVIRONMENT: "dev"



kubectl apply -f config.yml

kubectl get config -n nginx-demo
---
# ============================================================
# 3. SECRET
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: nginx-secret
  namespace: nginx-demo
type: Opaque
stringData:
  username: admin
  password: admin123


kubectl apply -f secret.yml

kubectl get secrets -n nginx-demo
---
# ============================================================
# 4. SERVICE ACCOUNT
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-sa
  namespace: nginx-demo

---
# ============================================================
# 5. ROLE
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nginx-role
  namespace: nginx-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
# ============================================================
# 6. ROLE BINDING
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nginx-rolebinding
  namespace: nginx-demo
subjects:
  - kind: ServiceAccount
    name: nginx-sa
    namespace: nginx-demo
roleRef:
  kind: Role
  name: nginx-role
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================
# 7. PERSISTENT VOLUME
# ============================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nginx-pv
spec:
  capacity:
    storage: 1Gi

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  hostPath:
    path: /tmp/nginx-data

---
# ============================================================
# 8. PERSISTENT VOLUME CLAIM
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nginx-pvc
  namespace: nginx-demo
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 1Gi

---
# ============================================================
# 9. DEPLOYMENT
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx-demo

  labels:
    app: nginx

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
        environment: dev

    spec:

      serviceAccountName: nginx-sa

      securityContext:
        runAsNonRoot: false

      containers:

        - name: nginx

          image: nginx:1.27

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80
              protocol: TCP

          # ------------------------------------------------
          # Environment Variables
          # ------------------------------------------------
          env:

            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: APP_NAME

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: nginx-config
                  key: ENVIRONMENT

            - name: USERNAME
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: username

            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nginx-secret
                  key: password

          # ------------------------------------------------
          # Resource Requests and Limits
          # ------------------------------------------------
          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          # ------------------------------------------------
          # LIVENESS PROBE
          # ------------------------------------------------
          livenessProbe:

            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # ------------------------------------------------
          # READINESS PROBE
          # ------------------------------------------------
          readinessProbe:

            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          # ------------------------------------------------
          # STARTUP PROBE
          # ------------------------------------------------
          startupProbe:

            httpGet:
              path: /
              port: 80

            failureThreshold: 30
            periodSeconds: 5

          # ------------------------------------------------
          # VOLUME
          # ------------------------------------------------
          volumeMounts:

            - name: nginx-storage
              mountPath: /usr/share/nginx/html

      # ----------------------------------------------------
      # VOLUME
      # ----------------------------------------------------
      volumes:

        - name: nginx-storage
          persistentVolumeClaim:
            claimName: nginx-pvc

---
# ============================================================
# 10. CLUSTERIP SERVICE
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
  namespace: nginx-demo

spec:
  type: ClusterIP

  selector:
    app: nginx

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---
# ============================================================
# 11. NODEPORT SERVICE
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: nginx-demo

spec:
  type: NodePort

  selector:
    app: nginx

  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP

---
# ============================================================
# 12. LOADBALANCER SERVICE
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: nginx-demo

spec:
  type: LoadBalancer

  selector:
    app: nginx

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

---
# ============================================================
# 13. INGRESS
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: nginx-demo

  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:

  ingressClassName: nginx

  rules:

    - host: nginx.example.com

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: nginx-clusterip
                port:
                  number: 80

---
# ============================================================
# 14. HORIZONTAL POD AUTOSCALER
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
  namespace: nginx-demo

spec:

  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-deployment

  minReplicas: 3
  maxReplicas: 10

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:
          type: Utilization
          averageUtilization: 70

---
# ============================================================
# 15. NETWORK POLICY
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-network-policy
  namespace: nginx-demo

spec:

  podSelector:
    matchLabels:
      app: nginx

  policyTypes:
    - Ingress
    - Egress

  ingress:

    - from:

        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-demo

      ports:

        - protocol: TCP
          port: 80

  egress:

    - {}

---
# ============================================================
# 16. POD DISRUPTION BUDGET
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-pdb
  namespace: nginx-demo

spec:

  minAvailable: 2

  selector:
    matchLabels:
      app: nginx